version: '3'

services:

  api:
    build:
      context: .
    command: sh ./entrypoint.sh
    env_file:
      - .env.docker
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
  
  consumer:
    build:
      context: .
    command: python -m app.messaging.consumer
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - rabbitmq
  
  worker:
    build:
      context: .
    command: taskiq worker app.workers.taskiq_broker:broker
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - rabbitmq

  postgres:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=interview_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
  
volumes:
  postgres_data:
