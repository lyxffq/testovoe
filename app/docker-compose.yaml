version: '3.9'

services:

  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.docker
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
  
  consumer:
    build:
      context: .
    command: python -m app.messaging.consumer
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - rabbitmq
  
  worker:
    build:
      context: .
    command: taskiq worker app.workers.taskiq_broker:broker
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - rabbitmq

  postgres:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=interview_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:5
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.3
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
  
volumes:
  postgres_data:
